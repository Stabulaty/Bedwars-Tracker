<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Bedwars Tracker</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		<script src="renderer.js"></script>
		<style>
			html, body {
			  margin: 0;
			  padding: 0;
			  background: transparent;
			  overflow: hidden;
			  font-family: Arial, sans-serif;
			}

			/* Navbar */
			.titlebar {
			  height: 28px;
			  background: rgba(30,30,30,0.85);
			  -webkit-app-region: drag;
			  display: flex;
			  align-items: center;
			  justify-content: space-between;
			  padding: 0 10px;
			  color: white;
			  font-size: 14px;
			}

			.titlebar .buttons {
			  display: flex;
			  align-items: center;
			}

			.titlebar button,
			.titlebar .reset {
			  -webkit-app-region: no-drag;
			  border: none;
			  background: transparent;
			  color: white;
			  font-size: 14px;
			  cursor: pointer;
			  margin-left: 8px;
			  pointer-events: auto;
			}

			.titlebar button:hover,
			.titlebar .reset:hover {
			  color: orange;
			}

			/* Tabelle */
			table {
			  width: 100%;
			  height: calc(100% - 28px);
			  border-collapse: collapse;
			  background: rgba(0,0,0,0.6);
			  color: white;
			  pointer-events: none; 
			}

			th, td {
			  border: 1px solid #555;
			  padding: 6px;
			}
		
			th {
				background: rgba(255,255,255,0.1);
			}
			
			.custom-dropleft{
				background: grey;
				border: 1px solid black !important;
				width: 180px;
				height: 28px;
			}

			.dropdown-title{
				color: white;
				font-size: 8px;
				font-family: Arial, sans-serif;
				margin-bottom: 5px;
			}

			.custom-file-btn{
				display: block;
				font-size: 14px;
				font-family: Arial, sans-serif;
				height: 21px;
				line-height: 10px;
				padding: 0 8px;
				border: 0px solid black;
				background: transparent !important;
				color: white;
				cursor: pointer;
				user-select: none;
			}
			
			.dropdown-wrapper {
			  position: relative;
			}
			
			.dropdown-menu {
			  transform: translate(-18px, -2.5px) !important;
			}
			
		</style>
	</head>
	<body>
		<div class="titlebar">
			<span>Bedwars Tracker</span>
			<div style="height: 21px">
				<p id="Finals_die_wir_verloren_haben_sadface" style="font-family:Arial; font-size:15px"> Finals Lost: <span style="color:lightgreen"> 0 </span> </p>
			</div>
			<div>
				<button class="button" id="Switch_button" onclick="switchen()">Switch to Beds</button>
				<div class="btn-group dropstart">
					<button class="button" type="button" data-bs-toggle="dropdown">
						⁝
					</button>

					<div class="dropdown-menu custom-dropleft p-2">

						<label for="Log-Input" class="custom-file-btn" type="button" id="pickBtn" onclick="Pfad()">
							Insert Log-File
						</label>
					</div>
				</div>
				<button class="button" id="Minimieren_button" onclick="require('electron').ipcRenderer.send('minimize')">-</button>
				<button class="button" id="Schließen_button" onclick="require('electron').ipcRenderer.send('quit')">x</button>
			</div>
		</div>

		<table style="text-align:center">
			<thead id="Log_output">
			<tr>
				<th>#</th>
				<th>Name</th>
				<th>Finals</th>
				<th>Session</th>
				<th>Deaths</th>
			</tr>
			</thead>
			<tbody id="tabelle"></tbody>
		</table>
	</body>
</html>

<script>
let filePath = null;
const { ipcRenderer } = require("electron");
let pfad = localStorage.getItem("Pfad");
let wasd = 0;
Initialisierung(pfad);

async function Pfad(){
		//console.log("click fired");
	filePath = await ipcRenderer.invoke("pick-log");
	if (filePath !== null){
		let Pfad_richtig = filePath.replace(/\\/g, "\\\\");
		
			//console.log(Pfad_richtig);
		localStorage.setItem("Pfad", Pfad_richtig);
		pfad = localStorage.getItem("Pfad");
		Initialisierung(pfad);
	}
};

function Initialisierung(pfad){
	if (!pfad){
		document.getElementById("Finals_die_wir_verloren_haben_sadface").innerHTML = "<span style=color:red> Pick a path first </span>";
	}
	else{
		let pfad2 = pfad.replace(/\\\\/g, "\\");
		if (pfad2.length > 20){
			let new_filePath = pfad2.slice(0, 20) + "...";
			document.getElementById("pickBtn").innerHTML = new_filePath;
		}
		else {
		document.getElementById("pickBtn").innerHTML = pfad2;
		}
		wasd ++;
		if (wasd < 2) document.getElementById("Finals_die_wir_verloren_haben_sadface").innerHTML = "Finals Lost: <span style=color:lightgreen> 0 </span>";
		Main(pfad);
	}
	
}

</script>
